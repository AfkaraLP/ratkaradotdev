[package]
name = "ratkara-server"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
rand = "0.10"
ratatui = { workspace = true, features = ["crossterm", "unstable-backend-writer"] }
ratkara-core.workspace = true
russh = { version = "0.65.1", default-features = false, features = ["ring", "flate2"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "time"] }
tower-http = { version = "0.7.1", features = ["fs"] }
ureq = "3"

[lints]
workspace = true
