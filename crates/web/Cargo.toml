[package]
name = "ratkara-web"
version.workspace = true
edition.workspace = true

[dependencies]
console_error_panic_hook = "0.1.7"
# provides the critical-section impl ratatui needs on wasm
critical-section = { version = "1.2", features = ["std"] }
ratkara-core.workspace = true
ratzilla = "0.3.1"
# has to match wasmBindgenCli in flake.nix
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "CssStyleDeclaration",
    "Document",
    "Element",
    "FontFaceSet",
    "History",
    "HtmlElement",
    "Location",
    "MediaQueryList",
    "NodeList",
    "Response",
    "Touch",
    "TouchEvent",
    "TouchList",
    "WheelEvent",
    "Window",
] }

[lints]
workspace = true
