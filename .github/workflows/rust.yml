name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/afkaralp/ratkaradotdev

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      with:
        nix_conf: |
          keep-env-derivations = true
          keep-outputs = true
    - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', 'flake.lock', 'Cargo.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-
        gc-max-store-size-linux: 6G
        purge: true
        purge-prefixes: nix-${{ runner.os }}-
        purge-created: 0
        purge-primary-key: never
    - name: Check
      run: nix flake check -L
    - name: Audit
      run: nix run nixpkgs#cargo-audit -- audit
    - name: Image
      run: nix build -L .#image && cp -L result image.tar.gz
    - name: Smoke test
      run: |
        docker load < image.tar.gz
        docker run -d --name smoke -p 8080:8080 -p 2222:2222 -e RATKARA_SITE_URL=https://afkara.dev "$IMAGE:latest"
        for _ in $(seq 30); do curl -fs -o /dev/null localhost:8080/ && break; sleep 1; done
        curl -fsS localhost:8080/ | grep -q AfkaraLP
        curl -fsSL -A Mozilla localhost:8080/blog/ratzilla | grep -q 'og:title'
        test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/nope)" = 404
        timeout 5 bash -c 'exec 3<>/dev/tcp/127.0.0.1/2222; head -c 7 <&3' | grep -q SSH-2.0
        docker exec smoke /bin/ratkara-server --health-check
        docker inspect --format '{{json .Config.Healthcheck}}' smoke | grep -q health-check
        timeout 5 docker stop -t 30 smoke
    - name: Smoke test logs
      if: failure()
      run: docker logs smoke
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: github.event_name != 'pull_request'
      with:
        name: image
        path: image.tar.gz
        retention-days: 7

  publish:

    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://afkara.dev
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: image
    - name: Push
      id: push
      env:
        TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        docker load < image.tar.gz
        docker tag "$IMAGE:latest" "$IMAGE:sha-${GITHUB_SHA::7}"
        docker push "$IMAGE:sha-${GITHUB_SHA::7}"
        docker push "$IMAGE:latest"
        echo "digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:latest" | cut -d@ -f2)" >> "$GITHUB_OUTPUT"
    - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: ${{ env.IMAGE }}
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: true
