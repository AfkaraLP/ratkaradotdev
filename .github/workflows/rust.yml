name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: DeterminateSystems/nix-installer-action@v16
    - name: Lint
      run: |
        nix develop -c cargo clippy --workspace --exclude ratkara-web --all-targets -- -D clippy::pedantic
        nix develop -c cargo clippy -p ratkara-web --target wasm32-unknown-unknown -- -D clippy::pedantic
    - name: Build
      run: nix build .#image
    - name: Publish
      if: github.event_name == 'push'
      env:
        TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        for tag in latest ${{ github.sha }}; do
          nix run nixpkgs#skopeo -- copy --dest-creds "${{ github.actor }}:$TOKEN" \
            docker-archive:result docker://ghcr.io/afkaralp/ratkaradotdev:$tag
        done
