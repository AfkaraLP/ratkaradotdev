[workspace]
resolver = "3"
members = ["crates/core", "crates/web", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
ratkara-core = { path = "crates/core" }
ratatui = { version = "0.30.2", default-features = false }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
